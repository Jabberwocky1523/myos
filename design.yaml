system:
  name: xv6实验系统-Lab1
  language: C与RISC-V汇编
  isa: RV64GC
machine:
  qemu:
    model: virt
  hardware:
    board: QEMU virt；真实板卡未在本实验中验证
    status: 已验证机器启动、串口输出和锁保护打印
kernel:
  organization: 单体式教学内核
  execution: QEMU通过entry.S进入机器模式，再转入监督者模式执行main
  protection: 使用PMP允许监督者访问物理地址空间
  communication: ns16550a UART串口
  resource_model: 自旋锁保护共享打印状态
required_mechanisms:
  - 机器模式早期入口与监督者模式切换
  - PMP全物理空间访问
  - UART字符输出与格式化打印
  - 自旋锁和中断状态保护
composition_invariants:
  - 只有boot hart继续执行内核主流程
  - 共享打印输出在持锁期间保持串行
  - 清理构建产物不会覆盖源代码
non_goals:
  - 物理页分配、页表和设备中断
  - 用户进程、系统调用和文件系统
hardware_port:
  board: QEMU virt
  boot: -bios none，kernel.ld将内核链接到0x80000000
  console: QEMU ns16550a UART
  interrupt: 本阶段不启用外部设备中断
