system:
  name: xv6实验系统-Lab3
  language: C与RISC-V汇编
  isa: RV64GC
machine:
  qemu:
    model: virt
  hardware:
    board: QEMU virt
    status: 已验证时钟、UART和PLIC外部中断
kernel:
  organization: 单体式教学内核
  execution: 监督者trap入口保存现场后由C分发
  protection: stvec与sstatus控制监督者异常
  communication: CLINT时钟、PLIC和ns16550a UART
  resource_model: 中断源由claim到complete形成一次生命周期
required_mechanisms:
  - trap.S现场保存
  - supervisor timer interrupt
  - UART receive interrupt
  - PLIC claim/complete
  - bounded diagnostics
composition_invariants:
  - stvec和设备初始化先于SIE开启
  - 未知IRQ也必须完成claim
  - trap返回保留sepc和sstatus
non_goals:
  - 用户态trap、进程调度和系统调用
hardware_port:
  board: QEMU virt
  boot: M-mode配置CLINT并转S-mode
  console: UART 0x10000000
  interrupt: PLIC 0x0c000000、UART IRQ 10
