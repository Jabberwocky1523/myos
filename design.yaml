system:
  name: xv6实验系统-Lab4
  language: C与RISC-V汇编
  isa: RV64GC
machine:
  qemu:
    model: virt
  hardware:
    board: QEMU virt
    status: 已验证首个用户进程进入U-mode并触发ecall
kernel:
  organization: 单体式教学内核
  execution: 调度器运行首个进程并通过trampoline进出用户态
  protection: 每进程页表和trapframe隔离
  communication: user ecall、时钟中断和UART
  resource_model: proc拥有页表、trapframe、内核栈和状态
required_mechanisms:
  - 多进程结构
  - 上下文切换
  - 每进程内核栈
  - 首个用户地址空间
  - trampoline uservec/userret
  - user ecall
composition_invariants:
  - 用户页表只公开用户映射
  - trapframe在切换前已映射
  - 新进程首次运行从proc_return进入用户态
non_goals:
  - fork/wait完整生命周期和文件系统
hardware_port:
  board: QEMU virt
  boot: 扩展kernel.ld支持trampsec
  console: QEMU UART
  interrupt: timer/PLIC沿用Lab3
