system:
  name: xv6实验系统-Lab1
  language: C与RISC-V汇编
  isa: RV64GC
machine:
  qemu:
    model: virt
    harts:
      default: 2
      configurable: true
      policy: 所有实验均须允许通过构建参数选择hart数量，未指定时启动2个hart。
  hardware:
    board: QEMU virt；真实板卡未在本实验中验证
    status: 已验证机器启动、串口输出和锁保护打印
required_mechanisms:
  - 机器模式早期入口与监督者模式切换
  - PMP全物理空间访问
  - UART字符输出与格式化打印
  - 自旋锁和中断状态保护
composition_invariants:
  - 只有boot hart继续执行内核主流程
  - 共享打印输出在持锁期间保持串行
  - 清理构建产物不会覆盖源代码
non_goals:
  - 物理页分配、页表和设备中断
  - 用户进程、系统调用和文件系统
hardware_port:
  board: QEMU virt
  boot: -bios none，kernel.ld将内核链接到0x80000000
  console: QEMU ns16550a UART
  interrupt: 本阶段不启用外部设备中断
