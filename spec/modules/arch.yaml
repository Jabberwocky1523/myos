id: kernel/arch
module: kernel/arch
purpose: 提供RISC-V架构基础类型、CSR访问、CPU上下文访问和页表/TLB控制接口。
owns:
  - src/kernel/arch/type.h
  - src/kernel/arch/method.h
  - src/kernel/arch/mod.h
constraints:
  - CSR访问必须运行在目标RISC-V允许的特权级。
  - 页表切换后必须调用sfence_vma刷新TLB。
functions:
  - name: r_mhartid
    comment:
      purpose: 提供r_mhartid架构接口。
      input:
        - 按寄存器接口约定传入参数；无参数接口依赖当前CPU状态。
      output: 返回寄存器值或完成状态更新；写入接口无直接返回值。
    pre:
      - 调用处于RISC-V目标环境且满足相应特权级。
    post:
      - 完成对应CSR、CPU上下文或地址转换操作。
    errors:
      - 源码未定义独立错误返回；非法特权级由硬件处理。
