interface:
  - name: buffer_get/buffer_put
    pre:
      - 块号在磁盘范围内
    post:
      - 返回唯一buffer并维护引用计数和LRU位置
    errors:
      - 无空闲buffer时失败
  - name: bitmap_alloc_block
    pre:
      - bitmap已从超级块布局初始化
    post:
      - 设置一个空闲位并写回位图块
    errors:
      - 无空闲位返回失败
properties:
  - id: disk-layout
    text: >-
      固定磁盘布局：block size=4096 Byte，total size=5124 MB，total blocks=1311787，total
      inodes=65536；superblock=block[0]；inode bitmap=block[1-2]；inode
      region=block[3-1026]；data bitmap=block[1027-1066]；data
      region=block[1067-1311786]。
  - id: unique-buffer
    text: 同一磁盘块同时只有一个cache实例。
  - id: lru-order
    text: active/inactive双链表按引用和最近使用顺序维护。
  - id: bitmap-persistence
    text: bitmap修改通过buffer_write同步到磁盘。
state:
  stage: block-cache
  owned_state:
    - buffer表、LRU链、bitmap块、超级块布局
  resource_lifetime:
    - ref归零buffer进入inactive，淘汰前必须无引用
preconditions:
  - VirtIO和进程睡眠机制已可用
postconditions:
  - 块数据和分配状态可跨请求保存
invariants:
  - id: cache-uniqueness
    text: 一个块号不对应两个live buffer。
  - id: ref-protection
    text: 有引用buffer不能被淘汰。
dependencies:
  - kernel/block-device
  - kernel/process
  - kernel/lock
rely:
  - 磁盘块大小512字节和mkfs布局
guarantee:
  - 为inode层提供稳定块缓存
algorithm_intent: 用活跃/非活跃链表实现LRU，用逐字节位运算操作bitmap。
