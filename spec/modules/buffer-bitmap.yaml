      - 可恢复失败按源码约定返回空值、零或负值。
  - name: bitmap_free_block
    comment:
      purpose: 释放一个block, 将data_bitmap对应bit设为0。
      input:
        - block_num（uint32）：待操作的锁对象。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
