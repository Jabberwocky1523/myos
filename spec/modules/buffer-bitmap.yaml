id: kernel/buffer-bitmap
module: kernel/buffer-bitmap
purpose: 管理内存中的唯一磁盘块缓存和磁盘空间位图。
owns:
  - src/kernel/fs/buf.c
  - src/kernel/fs/bitmap.c
  - src/kernel/fs/fs.c
  - src/kernel/fs/method.h
  - src/kernel/fs/mod.h
  - src/mkfs/mkfs.c
  - src/mkfs/mkfs.h
functions:
  - name: insert_node
    comment:
      purpose: 将一个节点拿出来并插入；1. 活跃链表的头部 buf_head_active->next；2. 活跃链表的尾部 buf_head_active->prev；3. 不活跃链表的头部 buf_head_inactive->next；4.
        不活跃链表的尾部 buf_head_inactive->prev。
      input:
        - node（buffer_node_t *）：insert_node使用的node参数。
        - insert_active（bool）：insert_node使用的insert_active参数。
        - insert_next（bool）：insert_node使用的insert_next参数。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 将一个节点拿出来并插入；1. 活跃链表的头部 buf_head_active->next；2. 活跃链表的尾部 buf_head_active->prev；3. 不活跃链表的头部 buf_head_inactive->next；4.
        不活跃链表的尾部 buf_head_inactive->prev。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: buffer_init
    comment:
      purpose: buffer系统初始化：；1. 初始化全局的lk_buf_cache + buf_head_active + buf_head_inactive；2. 初始化buf_cache中的所有node, 并将他们放在不活跃链表中。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - buffer系统初始化：；1. 初始化全局的lk_buf_cache + buf_head_active + buf_head_inactive；2. 初始化buf_cache中的所有node, 并将他们放在不活跃链表中。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: buffer_read
    comment:
      purpose: '磁盘读取: block -> buf。'
      input:
        - buf（buffer_t *）：数据缓冲区。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - '磁盘读取: block -> buf。'
    errors:
      - 检测到不可恢复的非法状态或资源错误时，源码会调用panic终止当前执行流。
  - name: buffer_write
    comment:
      purpose: '磁盘写入: buf -> block。'
      input:
        - buf（buffer_t *）：数据缓冲区。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - '磁盘写入: buf -> block。'
    errors:
      - 检测到不可恢复的非法状态或资源错误时，源码会调用panic终止当前执行流。
  - name: buffer_get
    comment:
      purpose: 从buf_cache中获取一个buf。
      input:
        - block_num（uint32）：待操作的锁对象。
      output: 返回buffer_t *类型指针；无可用结果时的行为由源码错误路径决定。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 从buf_cache中获取一个buf。
    errors:
      - 检测到不可恢复的非法状态或资源错误时，源码会调用panic终止当前执行流。
  - name: buffer_put
    comment:
      purpose: 向buf_cache归还一个buf。
      input:
        - buf（buffer_t *）：数据缓冲区。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 向buf_cache归还一个buf。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: buffer_freemem
    comment:
      purpose: 从后向前遍历非活跃链表, 尝试释放buffer_count个buffer持有的物理内存(data)；返回成功释放资源的buffer数量。
      input:
        - buffer_count（uint32）：操作数量或长度。
      output: 返回成功释放资源的buffer数量。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 从后向前遍历非活跃链表, 尝试释放buffer_count个buffer持有的物理内存(data)；返回成功释放资源的buffer数量。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: bitmap_search_and_set
    comment:
      purpose: 查询一个block中的所有bit, 找到空闲bit, 设置1并返回；如果没有空闲bit, 返回-1。
      input:
        - bitmap_block_num（uint32）：待操作的锁对象。
        - valid_count（uint32）：操作数量或长度。
      output: 查询一个block中的所有bit, 找到空闲bit, 设置1并返回；如果没有空闲bit, 返回-1。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 查询一个block中的所有bit, 找到空闲bit, 设置1并返回；如果没有空闲bit, 返回-1。
    errors:
      - 可恢复失败按源码约定返回空值、零或负值。
  - name: bitmap_clear
    comment:
      purpose: 将block中第index个bit设为0。
      input:
        - bitmap_block_num（uint32）：待操作的锁对象。
        - index（uint32）：bitmap_clear使用的index参数。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 将block中第index个bit设为0。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: bitmap_alloc_block
    comment:
      purpose: 获取一个空闲block, 将data_bitmap对应bit设为1；返回这个block的全局序号。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 返回这个block的全局序号。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - 获取一个空闲block, 将data_bitmap对应bit设为1；返回这个block的全局序号。
    errors:
      - 检测到不可恢复的非法状态或资源错误时，源码会调用panic终止当前执行流。
      - 可恢复失败按源码约定返回空值、零或负值。
  - name: bitmap_alloc_inode
    comment:
      purpose: 获取一个空闲inode, 将inode_bitmap对应bit设为1；返回这个inode的全局序号。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 返回这个inode的全局序号。
    pre:
