interface:
  - name: file_open/file_close/file_dup
    pre:
      - 当前进程和路径/权限合法
    post:
      - 文件对象和descriptor引用计数保持平衡
    errors:
      - 失败路径关闭已分配对象
  - name: file_read/file_write
    pre:
      - fd属于当前进程且对象类型支持操作
    post:
      - 按DATA/DIR/DEVICE类型分发并更新offset
    errors:
      - 非法fd、权限或设备major返回失败
  - name: device_read_data/device_write_data
    pre:
      - inode类型为DEVICE且major已注册
    post:
      - 调用对应设备实现
    errors:
      - 未知major拒绝访问
properties:
  - id: fd-ownership
    text: 每个进程槽位持有一个file引用，fork/dup/close分别增减引用。
  - id: line-console
    text: console使用输入缓冲和编辑操作，再交给read/write。
state:
  stage: file-management
  owned_state:
    - file table、进程open_file数组、cwd、device registry
  resource_lifetime:
    - 最后一个file引用关闭后释放inode引用
preconditions:
  - inode/dentry/fs和进程模块已完成
postconditions:
  - 用户程序可通过fd访问普通文件、目录和设备
invariants:
  - id: fd-balance
    text: 每次file_dup或fork继承必须有对应file_close。
  - id: device-major-bound
    text: major索引在设备表范围内。
dependencies:
  - kernel/inode
  - kernel/dentry-fs
  - kernel/process
  - kernel/uvm
  - kernel/syscall
rely:
  - 设备major约定和文件类型编码
guarantee:
  - 提供统一的read/write系统调用后端
algorithm_intent: 用引用计数file对象桥接进程fd槽位和inode/设备后端。
concurrency:
  module:
    module: kernel/file-device
    shared_state:
      - file table、console buffer
    lock_types:
      - spinlock
      - sleeplock
    lock_order:
      - console锁后不嵌套其他锁
    atomic_sections:
      - fd引用更新
    interrupt_rules:
      - UART输入在中断上下文只入缓冲
    rely:
      - 进程调度
    guarantee:
      - fd生命周期不泄漏
    wait_wakeup_rules:
      - console读取者等待输入
    forbidden_patterns:
      - 未知设备major直接索引
