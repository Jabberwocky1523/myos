id: kernel/boot
module: kernel/boot
purpose: 建立可运行的RV64内核入口并从机器模式进入监督者模式。
owns:
  - src/kernel/boot/entry.S
  - src/kernel/boot/start.c
  - src/loader/kernel.ld
  - src/kernel/main.c
functions:
  - name: _entry
    comment:
      purpose: 'kernel.ld 将_entry作为整个OS的起点放置到0x80000000处；qemu会自动跳转到0x80000000处并开始执行；注意: 此时是M-mode。'
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - 'kernel.ld 将_entry作为整个OS的起点放置到0x80000000处；qemu会自动跳转到0x80000000处并开始执行；注意: 此时是M-mode。'
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: start
    comment:
      purpose: 实现start在当前模块中的代码行为。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - 实现start在当前模块中的代码行为。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: main
    comment:
      purpose: 执行该程序或内核阶段的主流程，实现main对应的模块行为。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 返回int类型的状态值或计算结果；具体取值由源码中的返回分支定义。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - 执行该程序或内核阶段的主流程，实现main对应的模块行为。
    errors:
      - 检测到不可恢复的非法状态或资源错误时，源码会调用panic终止当前执行流。
interface:
  - name: machine_entry
    pre:
      - QEMU从链接地址进入机器模式
    post:
      - 设置早期栈并调用start
    errors:
      - 入口地址或栈布局错误导致启动失败
  - name: supervisor_handoff
    pre:
      - PMP已允许监督者访问内核镜像
    post:
      - mret后main在S-mode执行
    errors:
      - 缺少PMP配置时发生指令或数据访问异常
properties:
  - id: pmp-before-mret
    text: start在mret前设置pmpaddr0和pmpcfg0，赋予监督者读写执行权限。
errors:
  - 启动失败必须保留QEMU原始诊断
state:
  stage: early-boot
  owned_state:
    - boot hart早期栈
    - mstatus/mepc/PMP寄存器
  resource_lifetime:
    - 早期栈持续到内核生命周期结束
preconditions:
  - PATH中存在可用RV64工具链
postconditions:
  - main开始执行并能够访问UART
invariants:
  - id: single-boot-hart
    text: 只有hart 0进入当前实验主流程。
dependencies:
  - toolchain
rely:
  - QEMU virt的启动地址和PMP实现
guarantee:
  - 为lib和后续实验提供监督者执行环境
algorithm_intent: 使用entry.S设置栈，start配置PMP并通过mret切换特权级。
