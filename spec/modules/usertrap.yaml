interface:
  - name: trap_user_handler
    pre:
      - 当前进程有合法trapframe且来自U-mode
    post:
      - ecall推进sepc并完成helloworld分发，随后准备返回
    errors:
      - 未知异常输出scause/sepc/stval并终止当前进程
  - name: trap_user_return
    pre:
      - trapframe和用户页表有效
    post:
      - SPP清零、SPIE置位，trampoline恢复寄存器并sret
    errors:
      - 状态无效时不执行sret
properties:
  - id: ecall-advance
    text: 用户ecall返回地址增加4。
  - id: trampoline-boundary
    text: 用户trap入口位于TRAMPOLINE并在切换页表后恢复用户寄存器。
state:
  stage: user-mode-entry
  owned_state:
    - user trapframe、user sepc、satp字段
  resource_lifetime:
    - trapframe随进程存活
preconditions:
  - kernel trap入口已安装
postconditions:
  - initcode在U-mode继续执行
invariants:
  - id: privilege-clear
    text: 返回用户态前必须清除SPP并设置SPIE。
dependencies:
  - kernel/process
  - kernel/memory
  - kernel/trap
rely:
  - RISC-V sret语义和TRAMPOLINE映射
guarantee:
  - 用户代码不能直接绕过trapframe进入内核
algorithm_intent: 使用trampoline在用户页表和内核页表之间切换，并由C处理用户trap。
