id: kernel/usertrap
module: kernel/usertrap
purpose: 在U-mode和S-mode之间保存用户状态、处理ecall并安全返回。
owns:
  - src/kernel/trap/trap_user.c
  - src/kernel/trap/trampoline.S
  - src/user/initcode.c
  - src/user/sys.h
  - src/user/syscall_arch.h
  - src/user/syscall_num.h
functions:
  - name: trap_user_handler
    comment:
      purpose: '在user_vector()里面调用；用户态trap处理的核心逻辑；参考 xv6: kernel/trap.c usertrap()。'
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
      - 调用者必须满足源码assert检查的锁、类型或状态条件。
    post:
      - '在user_vector()里面调用；用户态trap处理的核心逻辑；参考 xv6: kernel/trap.c usertrap()。'
    errors:
      - 检测到不可恢复的非法状态或资源错误时，源码会调用panic终止当前执行流。
      - 源码断言不成立时触发assert诊断。
  - name: trap_user_return
    comment:
      purpose: '调用user_return()；内核态返回用户态；参考 xv6: kernel/trap.c usertrapret()。'
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 内核态返回用户态。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - '调用user_return()；内核态返回用户态；参考 xv6: kernel/trap.c usertrapret()。'
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: trampoline
    comment:
      purpose: trampoline会作为一个物理页的起点地址。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - trampoline会作为一个物理页的起点地址。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: user_vector
    comment:
      purpose: 触发用户态trap后的处理过程。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - 触发用户态trap后的处理过程。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: user_return
    comment:
      purpose: 用户态trap处理完成后返回。
      input:
        - trapframe（寄存器参数）：user_return使用的trapframe参数。
        - pagetable（寄存器参数）：待切换或访问的页表。
      output: 用户态trap处理完成后返回。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 用户态trap处理完成后返回。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
