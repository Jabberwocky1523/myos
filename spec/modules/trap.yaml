id: kernel/trap
module: kernel/trap
purpose: 建立监督者trap入口并分发时钟与串口外部中断。
owns:
  - src/kernel/trap/trap.S
  - src/kernel/trap/trap_kernel.c
  - src/kernel/trap/timer.c
  - src/kernel/trap/plic.c
  - src/kernel/trap/type.h
functions:
  - name: kernel_vector
    comment:
      purpose: S-mode 中断处理 (包括软件中断和外设中断)。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - S-mode 中断处理 (包括软件中断和外设中断)。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: timer_vector
    comment:
      purpose: M-mode 中断处理 (包括时钟中断)。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
