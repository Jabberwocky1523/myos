interface:
  - name: trap_kernel_init
    pre:
      - 内核页表已激活且SIE关闭
    post:
      - stvec指向kernel_vector
    errors:
      - 入口符号缺失时构建失败
  - name: timer_interrupt_handler
    pre:
      - 当前scause为时钟中断
    post:
      - 更新mtimecmp并增加时间滴答
    errors:
      - 非法hart编号拒绝写CLINT
  - name: external_interrupt_handler
    pre:
      - 当前scause为S-mode external interrupt
    post:
      - PLIC claim、设备处理、complete按顺序完成
    errors:
      - 未知IRQ打印诊断并仍完成claim
properties:
  - id: frame-symmetry
    text: 汇编入口保存并恢复被修改的寄存器。
  - id: serial-input
    text: UART接收字符经PLIC IRQ 10进入console回显。
state:
  stage: traps
  owned_state:
    - stvec、CLINT比较值、PLIC使能和claim状态
  resource_lifetime:
    - trap入口和设备配置持续到内核结束
preconditions:
  - Lab2已激活kernel_pgtbl
postconditions:
  - 时钟和UART事件可被诊断和处理
invariants:
  - id: enable-order
    text: trap向量、PLIC和UART初始化完成后才能开启SIE。
  - id: claim-completion
    text: 每个非零claim恰好完成一次。
dependencies:
  - kernel/boot
  - kernel/memory
  - kernel/lock
rely:
  - QEMU CLINT/PLIC/UART寄存器布局
guarantee:
  - 为用户trap和调度提供可靠的监督者中断入口
algorithm_intent: 汇编保存现场，C读取scause并将设备中断路由到具体处理器。
concurrency:
  module:
    module: kernel/trap
    shared_state:
      - PLIC状态、UART状态
    lock_types:
      - spinlock
    lock_order: []
    atomic_sections:
      - claim到complete
    interrupt_rules:
      - 分发期间保持中断关闭
    rely:
      - 单hart实验
    guarantee:
      - 中断处理不睡眠
    wait_wakeup_rules: []
    forbidden_patterns:
      - 初始化完成前开启SIE
  operations:
    external_interrupt_handler:
      atomicity: one claim-dispatch-complete sequence
