    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - M-mode 中断处理 (包括时钟中断)。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: trap_kernel_init
    comment:
      purpose: 初始化trap中各个核心共享的东西。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 调用时必须满足模块初始化顺序和当前执行上下文要求。
    post:
      - 初始化trap中各个核心共享的东西。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: trap_kernel_inithart
    comment:
      purpose: 初始化trap中各个核心独有的东西。
      input:
        - 无显式参数；函数依赖当前CPU、进程或模块全局状态。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
