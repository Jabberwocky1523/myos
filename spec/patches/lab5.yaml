id: lab5-user-vm-syscall
transition: lab4 -> lab5
reason: 将用户地址空间管理和系统调用参数传递接入Lab4用户进程。
changes:
- kernel/uvm
- kernel/syscall
- kernel/usertrap
- kernel/process
- toolchain
required_updates:
- target: main
  module: kernel/boot
  change: 在创建用户进程前初始化mmap节点资源池。
  reason: 后续系统调用和进程地址空间初始化会使用mmap节点。
- target: proc_make_first
  module: kernel/process
  change: 为首个进程初始化heap、用户栈和mmap状态。
  reason: Lab4的固定地址空间需要扩展为可由brk、缺页和mmap动态管理的地址空间。
- target: trap_user_handler
  module: kernel/usertrap
  change: 将ecall处理改为统一调用syscall分发器，并在用户缺页时尝试扩展用户栈。
  reason: 用户trap需要承接Lab5新增的系统调用和按需栈增长机制。
- target: proc_t
  module: kernel/process
  change: 为进程地址空间状态增加heap_top、ustack_npage和mmap链表头，并在创建首进程时初始化为与实际页表映射一致的值。
  reason: brk、自动栈增长、mmap和地址空间销毁都依赖这些元数据描述已经发布的用户映射。
- target: syscall、syscall_num
  module: kernel/syscall
  change: 建立brk、mmap、munmap及用户内存复制相关调用号与内核分发表的对应关系，统一通过trapframe传参和返回。
  reason: trap_user_handler转交给统一分发器后，调用号、参数提取和处理函数必须一致才能形成完整ecall路径。
- target: Makefile
  module: toolchain
  change: 把uvm、mmap和syscall目录的对象加入内核构建，并在用户入口重建后重新生成内嵌initcode。
  reason: 用户虚拟内存和系统调用实现必须与调用它们的用户入口一起进入同一阶段镜像。
- target: common.mk
  module: toolchain
  change: 全局使用-O1和-freorder-functions，同时保留-fno-omit-frame-pointer。
  reason: 避免编译器在Lab5大栈数组的指定访问前先访问栈底，并保证main继续位于固定用户入口0x1000。
new_invariants:
- 系统调用不能绕过用户页表验证
- 地址空间修改失败不得破坏原有已发布映射
- proc_t中的heap、stack和mmap元数据必须与页表中的已发布映射一致
- 用户调用号、内核分发表索引和处理函数声明必须一一对应
verification:
- id: user-kernel-copy
  entry: sys_copyin / sys_copyout / sys_copyinstr
  setup:
  - 在initcode中准备整数数组和以NUL结尾的字符串。
  steps:
  - 通过系统调用把用户数组复制进内核并复制回用户空间。
  - 复制跨页字符串并限制最大长度。
  - 传入越界或未映射地址验证失败路径。
  expected:
  - 合法数组和字符串往返后内容一致。
  - 字符串在NUL或maxlen处停止。
  - 非法用户地址被拒绝，不允许内核直接解引用。
- id: heap-and-stack-growth
  entry: SYS_brk and user page-fault path
  setup:
  - 在initcode中查询当前堆顶并准备深层栈访问。
  steps:
  - 用brk扩展和收缩堆并读写新区域。
  - 触发位于合法栈增长范围内的缺页。
  - 尝试让heap、stack或mmap区域越界重叠。
  expected:
  - brk(0)返回当前堆顶，合法增长后页面可读写。
  - 合法栈缺页自动映射新页并返回用户态。
  - 越界、重叠或非法收缩返回失败且不破坏原映射。
- id: mmap-node-pool
  entry: mmap_region_alloc / mmap_region_free
  setup:
  - 初始化mmap节点池。
  steps:
  - 分配全部256个节点并记录index。
  - 按交错顺序释放，再次分配全部节点。
  expected:
  - 首次index按0到255覆盖且不重复。
  - 释放后节点全部可再次取得。
  - 节点链无环、无丢失且空闲计数恢复。
- id: mmap-munmap-layout
  entry: initcode mmap/munmap sequence
  setup:
  - 使用Lab5分支现有initcode中的映射与解除映射序列。
  steps:
  - 按既定地址依次建立多个相邻和分离区域。
  - 执行跨区域、前缀、后缀和整段munmap。
  - 检查最终mmap链和对应页表。
  expected:
  - 区域始终按地址有序且互不重叠。
  - 可合并区域正确合并，部分解除映射正确拆分。
  - 未映射范围或非法参数返回失败，已发布映射保持一致。
- id: page-table-copy-destroy
  entry: uvm_copy_pgtbl / uvm_destroy_pgtbl
  setup:
  - 准备包含heap、stack和mmap页面的源用户页表。
  steps:
  - 复制页表并比较各区域数据。
  - 修改副本页面确认物理页不与源共享。
  - 销毁副本并检查页表页、数据页和mmap资源释放。
  expected:
  - 副本虚拟布局、权限和初始内容与源一致。
  - 修改副本不影响源地址空间。
  - 销毁后资源计数恢复且源页表仍有效。
