id: kernel/sleep-timer
module: kernel/sleep-timer
purpose: 将时钟滴答转化为可睡眠的时间等待并支持抢占。
owns:
  - src/kernel/lock/sleeplock.c
functions:
  - name: sleeplock_init
    comment:
      purpose: 睡眠锁初始化。
      input:
        - lk（sleeplock_t *）：待操作的锁对象。
        - name（char *）：目标名称字符串。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 睡眠锁初始化。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: sleeplock_holding
    comment:
      purpose: 检查当前进程是否持有睡眠锁。
      input:
        - lk（sleeplock_t *）：待操作的锁对象。
      output: 返回布尔值，表示源码所检查的条件或操作结果是否成立。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 检查当前进程是否持有睡眠锁。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: sleeplock_acquire
    comment:
      purpose: 当前进程尝试获取睡眠锁, 失败进入睡眠状态。
      input:
        - lk（sleeplock_t *）：待操作的锁对象。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 当前进程尝试获取睡眠锁, 失败进入睡眠状态。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
  - name: sleeplock_release
    comment:
      purpose: 释放睡眠锁, 唤醒其他等待睡眠锁的进程。
      input:
        - lk（sleeplock_t *）：待操作的锁对象。
      output: 无直接返回值；通过修改模块状态、寄存器、内存或输出参数产生结果。
    pre:
      - 输入参数必须满足源码中的指针有效性、地址范围、长度和对象状态约束。
    post:
      - 释放睡眠锁, 唤醒其他等待睡眠锁的进程。
    errors:
      - 源码未定义独立错误返回；调用者需满足前置条件并处理下游调用的失败语义。
interface:
  - name: timer_wait
    pre:
      - 目标tick可表示且当前进程可睡眠
    post:
      - 达到目标tick后返回
    errors:
      - 时钟状态不一致拒绝等待
  - name: proc_yield
    pre:
      - 当前进程持有正确proc锁
    post:
      - 进程变为RUNNABLE并切换到scheduler
    errors:
      - 锁、状态或中断计数不匹配时停止
properties:
  - id: timer-wakeup
    text: 每个时钟滴答唤醒等待该时钟空间的进程。
  - id: sleeplock
    text: 睡眠锁以自旋锁保护持有者并在竞争时sleep。
state:
  stage: scheduling
  owned_state:
    - sys_timer、sleep channel、sleeplock holder
  resource_lifetime:
    - 等待者唤醒或进程退出时清理等待状态
preconditions:
  - CLINT时钟和proc调度器已初始化
postconditions:
  - 时钟可驱动抢占和阻塞等待
invariants:
  - id: no-sleep-in-interrupt
    text: 中断处理只唤醒，不在中断上下文睡眠。
dependencies:
  - kernel/process
  - kernel/trap
rely:
  - QEMU CLINT频率和timer_interrupt_handler
guarantee:
  - 系统调用可提供sleep语义
algorithm_intent: timer tick更新全局计数，等待者通过proc_sleep/proc_wakeup同步。
